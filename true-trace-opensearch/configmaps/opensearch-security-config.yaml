apiVersion: v1
data:
  action_groups.yml: |
    ---
    _meta:
      type: "actiongroups"
      config_version: 2

    actiongroups: {}
  config.yml: |
    ---
    _meta:
      type: "config"
      config_version: 2

    config:
      dynamic:
        http:
          anonymous_auth_enabled: false
          xff:
            enabled: false
            internalProxies: '192\.168\.0\.10|192\.168\.0\.11'

        authc:
          openid_auth_domain:
            http_enabled: true
            transport_enabled: true
            order: 0
            http_authenticator:
              type: openid
              challenge: false
              config:
                subject_key: sub
                roles_key: "cognito:groups"
                openid_connect_url: "https://cognito-idp.eu-west-1.amazonaws.com/eu-west-1_OlzCnxtw7/.well-known/openid-configuration"
            authentication_backend:
              type: noop
              config: {}
            description: Authenticate using OpenId connect

          kerberos_auth_domain:
            http_enabled: false
            transport_enabled: false
            order: 6
            http_authenticator:
              type: kerberos
              challenge: true
              config:
                krb_debug: false
                strip_realm_from_principal: true
            authentication_backend:
              type: noop

          basic_internal_auth_domain:
            description: Authenticate via HTTP Basic against internal users database
            http_enabled: true
            transport_enabled: true
            order: 4
            http_authenticator:
              type: basic
              challenge: true
            authentication_backend:
              type: internal

          proxy_auth_domain:
            description: Authenticate via proxy
            http_enabled: false
            transport_enabled: false
            order: 3
            http_authenticator:
              type: proxy
              challenge: false
              config:
                user_header: "x-proxy-user"
                roles_header: "x-proxy-roles"
            authentication_backend:
              type: noop

          jwt_auth_domain:
            description: Authenticate via Json Web Token
            http_enabled: false
            transport_enabled: false
            order: 0
            http_authenticator:
              type: jwt
              challenge: false
              config:
                signing_key: "base64 encoded HMAC key or public RSA/ECDSA pem key"
                jwt_header: "Authorization"
                jwt_url_parameter: null
                jwt_clock_skew_tolerance_seconds: 30
                roles_key: null
                subject_key: null
            authentication_backend:
              type: noop

          clientcert_auth_domain:
            description: Authenticate via SSL client certificates
            http_enabled: false
            transport_enabled: false
            order: 2
            http_authenticator:
              type: clientcert
              challenge: false
              config:
                username_attribute: cn
            authentication_backend:
              type: noop

          ldap:
            description: Authenticate via LDAP or Active Directory
            http_enabled: false
            transport_enabled: false
            order: 5
            http_authenticator:
              type: basic
              challenge: false
            authentication_backend:
              type: ldap
              config:
                enable_ssl: false
                enable_start_tls: false
                enable_ssl_client_auth: false
                verify_hostnames: true
                hosts:
                  - localhost:8389
                bind_dn: null
                password: null
                userbase: "ou=people,dc=example,dc=com"
                usersearch: "(sAMAccountName={0})"
                username_attribute: null

        authz:
          roles_from_myldap:
            description: Authorize via LDAP or Active Directory
            http_enabled: false
            transport_enabled: false
            authorization_backend:
              type: ldap
              config:
                enable_ssl: false
                enable_start_tls: false
                enable_ssl_client_auth: false
                verify_hostnames: true
                hosts:
                  - localhost:8389
                bind_dn: null
                password: null
                rolebase: "ou=groups,dc=example,dc=com"
                rolesearch: "(member={0})"
                userroleattribute: null
                userrolename: disabled
                rolename: cn
                resolve_nested_roles: true
                userbase: "ou=people,dc=example,dc=com"
                usersearch: "(uid={0})"

          roles_from_another_ldap:
            description: Authorize via another Active Directory
            http_enabled: false
            transport_enabled: false
            authorization_backend:
              type: ldap
  internal_users.yml: |
    ---
    _meta:
      type: "internalusers"
      config_version: 2

    admin:
      hash: "$2y$12$Treo8EwWhsEPMWEVSXlWjeodQGhmd22eFCuwSzT0DM5C4STpE0EUm"
      reserved: true
      backend_roles:
        - "admin"
  nodes_dn.yml: |
    _meta:
      type: "nodesdn"
      config_version: 2
  roles.yml: |
    ---
    _meta:
      type: "roles"
      config_version: 2
  roles_mapping.yml: |
    ---
    _meta:
      type: "rolesmapping"
      config_version: 2

    all_access:
      users:
        - "admin"
      backend_roles:
        - "admin"
        - "all_access"
  tenants.yml: |
    ---
    _meta:
      type: "tenants"
      config_version: 2

    admin_tenant:
      reserved: false
  whitelist.yml: |
    _meta:
      type: "whitelist"
      config_version: 2
    allowed_hosts:
      enabled: false
      requests: {}
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/tracking-id: true-trace-opensearch:/ConfigMap:logging/opensearch-security-config
